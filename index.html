<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>클랭크 카타콤: 던전 실시간 점수 계산기</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nanum+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0c0908;
            --panel-bg: #1a1512;
            --panel-border: #3d2e24;
            --accent-gold: #d4af37;
            --accent-gold-hover: #f1c40f;
            --text-main: #e0d5c1;
            --text-muted: #9c8b77;
            --danger: #c0392b;
            --success: #27ae60;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Nanum Gothic', sans-serif;
            background-image: radial-gradient(circle at center, #231914 0%, #0c0908 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--accent-gold);
            padding-bottom: 20px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: var(--accent-gold);
            font-size: 2.2rem;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.7);
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .card {
            background-color: var(--panel-bg);
            border: 2px solid var(--panel-border);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
        }

        h2 {
            font-family: 'Cinzel', serif;
            color: var(--accent-gold);
            font-size: 1.3rem;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 8px;
        }

        input[type="text"], input[type="number"], select {
            background-color: #0f0b09;
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
            width: 100%;
        }

        input[type="text"]:focus, input[type="number"]:focus, select:focus {
            border-color: var(--accent-gold);
        }

        button {
            background: linear-gradient(to bottom, #d4af37, #997a15);
            color: #0c0908;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            transition: all 0.2s;
        }

        button:hover {
            background: linear-gradient(to bottom, #f1c40f, #b8860b);
            transform: translateY(-1px);
        }

        .player-form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            cursor: pointer;
            background: #0f0b09;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid var(--panel-border);
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-gold);
            cursor: pointer;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .leaderboard-table th, .leaderboard-table td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid var(--panel-border);
        }

        .leaderboard-table th {
            background-color: #231914;
            color: var(--accent-gold);
            font-family: 'Cinzel', serif;
        }

        .leaderboard-table tr:hover {
            background-color: rgba(212, 175, 55, 0.05);
        }

        .rank-1 {
            color: var(--accent-gold);
            font-weight: bold;
        }

        .log-container {
            background-color: #0f0b09;
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            height: 150px;
            overflow-y: auto;
            padding: 10px;
            font-family: monospace;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .log-item {
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid var(--accent-gold);
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dead-badge {
            color: var(--danger);
            font-weight: bold;
        }

        .alive-badge {
            color: var(--success);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>CLANK! CATACOMBS</h1>
        <div class="subtitle">지하 카타콤의 심장부, 실시간 탐험 점수 정산소</div>
    </header>

    <!-- 탐험가 세팅 섹션 -->
    <section class="card" id="setup-section">
        <h2>탐험가 구성 설정</h2>
        <div class="player-form-grid" style="margin-bottom: 15px;">
            <div class="input-group">
                <label>참여 탐험가 수</label>
                <input type="number" id="player-count" min="1" max="6" value="2">
            </div>
        </div>
        <div id="player-name-inputs" class="player-form-grid" style="margin-bottom: 15px;"></div>
        <button id="btn-init-players">탐험대 구성 완료 및 시작</button>
    </section>

    <!-- 점수 기록 섹션 -->
    <section class="card" id="scoring-section" style="display:none;">
        <h2>탐험가별 기록 관리</h2>
        <div class="input-group" style="margin-bottom: 15px;">
            <label>기록할 탐험가 선택</label>
            <select id="active-player-select"></select>
        </div>

        <div class="player-form-grid">
            <div class="input-group" style="grid-column: 1 / -1;">
                <label class="checkbox-group">
                    <input type="checkbox" id="input-is-alive" checked>
                    <span>던전 탈출 생존 여부 (체크 해제 시 모든 점수 0점 처리 및 입력 차단)</span>
                </label>
            </div>
            
            <div class="input-group">
                <label>임무 완수 토큰 (+20점)</label>
                <label class="checkbox-group">
                    <input type="checkbox" id="input-mission">
                    <span>임무 완수 조건 만족 (+20점 획득)</span>
                </label>
            </div>
            
            <div class="input-group">
                <label>유물 점수 (깡점수)</label>
                <input type="number" id="input-artifact" value="0" min="0">
            </div>

            <div class="input-group">
                <label>금화 개수 (+1점/개당)</label>
                <input type="number" id="input-gold" value="0" min="0">
            </div>

            <div class="input-group">
                <label>토큰 점수 (깡점수)</label>
                <input type="number" id="input-token" value="0" min="0">
            </div>

            <div class="input-group">
                <label>카드 점수 (깡점수)</label>
                <input type="number" id="input-card" value="0" min="0">
            </div>
        </div>

        <button id="btn-record-score" style="margin-top: 20px; width: 100%;">점수 기록 및 실시간 반영</button>
    </section>

    <!-- 실시간 순위표 및 피드 섹션 -->
    <section class="card" id="dashboard-section" style="display:none;">
        <h2>실시간 던전 탐험 순위</h2>
        <table class="leaderboard-table">
            <thead>
                <tr>
                    <th>순위</th>
                    <th>탐험가 이름</th>
                    <th>생존 상태</th>
                    <th>유물 점수</th>
                    <th>총점</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body"></tbody>
        </table>

        <h2 style="margin-top: 30px;">실시간 점수 변동 피드</h2>
        <div class="log-container" id="score-log-feed">
            <div class="log-item">[시스템] 카타콤 던전 탐험이 시작되었습니다. 점수를 기록해 주세요.</div>
        </div>
    </section>
</div>

<script>
    let sessionData = {
        players: []
    };

    const setupSection = document.getElementById('setup-section');
    const scoringSection = document.getElementById('scoring-section');
    const dashboardSection = document.getElementById('dashboard-section');
    
    const playerCountInput = document.getElementById('player-count');
    const playerNameInputs = document.getElementById('player-name-inputs');
    const btnInitPlayers = document.getElementById('btn-init-players');
    
    const activePlayerSelect = document.getElementById('active-player-select');
    const inputIsAlive = document.getElementById('input-is-alive');
    const inputMission = document.getElementById('input-mission');
    const inputArtifact = document.getElementById('input-artifact');
    const inputGold = document.getElementById('input-gold');
    const inputToken = document.getElementById('input-token');
    const inputCard = document.getElementById('input-card');
    const btnRecordScore = document.getElementById('btn-record-score');
    
    const leaderboardBody = document.getElementById('leaderboard-body');
    const scoreLogFeed = document.getElementById('score-log-feed');

    function renderPlayerNameInputs() {
        const count = parseInt(playerCountInput.value) || 2;
        playerNameInputs.innerHTML = '';
        for (let i = 0; i < count; i++) {
            playerNameInputs.innerHTML += `
                <div class="input-group">
                    <label>탐험가 ${i + 1} 이름</label>
                    <input type="text" class="p-name-input" value="모험가 ${i + 1}">
                </div>
            `;
        }
    }

    playerCountInput.addEventListener('input', renderPlayerNameInputs);
    renderPlayerNameInputs();

    btnInitPlayers.addEventListener('click', () => {
        const nameInputs = document.querySelectorAll('.p-name-input');
        sessionData.players = [];
        
        nameInputs.forEach((input, index) => {
            sessionData.players.push({
                id: index,
                name: input.value.trim() || `모험가 ${index + 1}`,
                isAlive: true,
                mission: false,
                artifact: 0,
                gold: 0,
                token: 0,
                card: 0,
                totalScore: 0
            });
        });

        updatePlayerSelect();
        updateLeaderboard();
        
        setupSection.style.display = 'none';
        scoringSection.style.display = 'block';
        dashboardSection.style.display = 'block';
    });

    function updatePlayerSelect() {
        activePlayerSelect.innerHTML = '';
        sessionData.players.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.id;
            opt.textContent = p.name;
            activePlayerSelect.appendChild(opt);
        });
        loadPlayerDataToForm(sessionData.players[0].id);
    }

    activePlayerSelect.addEventListener('change', (e) => {
        loadPlayerDataToForm(parseInt(e.target.value));
    });

    function loadPlayerDataToForm(playerId) {
        const p = sessionData.players.find(item => item.id === playerId);
        if (!p) return;
        inputIsAlive.checked = p.isAlive;
        inputMission.checked = p.mission;
        inputArtifact.value = p.artifact;
        inputGold.value = p.gold;
        inputToken.value = p.token;
        inputCard.value = p.card;
        
        toggleScoreInputs(!p.isAlive);
    }

    inputIsAlive.addEventListener('change', (e) => {
        toggleScoreInputs(!e.target.checked);
    });

    function toggleScoreInputs(isDead) {
        inputMission.disabled = isDead;
        inputArtifact.disabled = isDead;
        inputGold.disabled = isDead;
        inputToken.disabled = isDead;
        inputCard.disabled = isDead;
        if (isDead) {
            inputMission.checked = false;
            inputArtifact.value = 0;
            inputGold.value = 0;
            inputToken.value = 0;
            inputCard.value = 0;
        }
    }

    btnRecordScore.addEventListener('click', () => {
        const selectedId = parseInt(activePlayerSelect.value);
        const p = sessionData.players.find(item => item.id === selectedId);
        if (!p) return;

        const isAlive = inputIsAlive.checked;
        p.isAlive = isAlive;

        if (!isAlive) {
            p.mission = false;
            p.artifact = 0;
            p.gold = 0;
            p.token = 0;
            p.card = 0;
            p.totalScore = 0;
            addLog(`[사망] ${p.name}님이 카타콤에서 탈출하지 못해 모든 점수가 무효화되었습니다! (0점)`);
        } else {
            p.mission = inputMission.checked;
            p.artifact = parseInt(inputArtifact.value) || 0;
            p.gold = parseInt(inputGold.value) || 0;
            p.token = parseInt(inputToken.value) || 0;
            p.card = parseInt(inputCard.value) || 0;

            const missionScore = p.mission ? 20 : 0;
            p.totalScore = missionScore + p.artifact + p.gold + p.token + p.card;

            addLog(`[기록 갱신] ${p.name}님의 점수가 업데이트되었습니다! (획득 총점: ${p.totalScore}점)`);
        }

        updateLeaderboard();
    });

    function updateLeaderboard() {
        const sortedPlayers = [...sessionData.players].sort((a, b) => {
            if (b.totalScore !== a.totalScore) {
                return b.totalScore - a.totalScore;
            }
            return b.artifact - a.artifact;
        });

        leaderboardBody.innerHTML = '';
        sortedPlayers.forEach((p, index) => {
            const tr = document.createElement('tr');
            if (index === 0) tr.classList.add('rank-1');

            const rankText = `${index + 1}위`;
            const aliveBadge = p.isAlive 
                ? `<span class="alive-badge">생존 탈출</span>` 
                : `<span class="dead-badge">사망 (0점)</span>`;

            tr.innerHTML = `
                <td>${rankText}</td>
                <td>${p.name}</td>
                <td>${aliveBadge}</td>
                <td>${p.artifact}점</td>
                <td><strong>${p.totalScore}점</strong></td>
            `;
            leaderboardBody.appendChild(tr);
        });
    }

    function addLog(message) {
        const div = document.createElement('div');
        div.className = 'log-item';
        div.textContent = `${new Date().toLocaleTimeString()} - ${message}`;
        scoreLogFeed.prepend(div);
    }
</script>

</body>
</html>
