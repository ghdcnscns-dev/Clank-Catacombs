<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>클랭크 카타콤: 던전 실시간 점수 계산기</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nanum+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0c0908;
            --panel-bg: #1a1512;
            --panel-border: #3d2e24;
            --accent-gold: #d4af37;
            --accent-gold-hover: #f1c40f;
            --text-main: #e0d5c1;
            --text-muted: #9c8b77;
            --danger: #c0392b;
            --success: #27ae60;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Nanum Gothic', sans-serif;
            background-image: radial-gradient(circle at center, #231914 0%, #0c0908 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--accent-gold);
            padding-bottom: 20px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: var(--accent-gold);
            font-size: 2.2rem;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.7);
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .card {
            background-color: var(--panel-bg);
            border: 2px solid var(--panel-border);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
            position: relative;
        }

        h2 {
            font-family: 'Cinzel', serif;
            color: var(--accent-gold);
            font-size: 1.3rem;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 8px;
        }

        input[type="text"], input[type="number"] {
            background-color: #0f0b09;
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
            width: 100%;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: var(--accent-gold);
        }

        button {
            background: linear-gradient(to bottom, #d4af37, #997a15);
            color: #0c0908;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            transition: all 0.2s;
        }

        button:hover {
            background: linear-gradient(to bottom, #f1c40f, #b8860b);
            transform: translateY(-1px);
        }

        .player-form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        /* 플레이어 카드 (오버레이 부모) */
        .player-card {
            background-color: #130f0d;
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }

        .player-card-header {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            color: var(--accent-gold);
            border-bottom: 1px dashed var(--panel-border);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            background: #0f0b09;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid var(--panel-border);
            font-size: 0.9rem;
        }

        .checkbox-group input {
            width: 16px;
            height: 16px;
            accent-color: var(--accent-gold);
            cursor: pointer;
        }

        .score-inputs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        /* 사망 오버레이 스타일 */
        .death-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(12, 9, 8, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .death-overlay.hidden {
            display: none;
        }

        .death-title {
            font-family: 'Cinzel', serif;
            color: var(--danger);
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(192, 57, 43, 0.6);
            animation: pulseText 1.5s infinite alternate;
        }

        @keyframes pulseText {
            from { transform: scale(1); text-shadow: 0 0 5px rgba(192, 57, 43, 0.4); }
            to { transform: scale(1.05); text-shadow: 0 0 15px rgba(192, 57, 43, 0.8); }
        }

        /* 닫기 (X) 버튼 */
        .btn-close-death {
            background: transparent;
            border: 2px solid var(--danger);
            color: var(--danger);
            padding: 6px 16px;
            border-radius: 4px;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: none;
            transition: all 0.2s;
        }

        .btn-close-death:hover {
            background-color: var(--danger);
            color: white;
            transform: none;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .leaderboard-table th, .leaderboard-table td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid var(--panel-border);
        }

        .leaderboard-table th {
            background-color: #231914;
            color: var(--accent-gold);
            font-family: 'Cinzel', serif;
        }

        .leaderboard-table tr:hover {
            background-color: rgba(212, 175, 55, 0.05);
        }

        .rank-1 {
            color: var(--accent-gold);
            font-weight: bold;
        }

        .log-container {
            background-color: #0f0b09;
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            height: 150px;
            overflow-y: auto;
            padding: 10px;
            font-family: monospace;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .log-item {
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid var(--accent-gold);
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dead-badge {
            color: var(--danger);
            font-weight: bold;
        }

        .alive-badge {
            color: var(--success);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>CLANK! CATACOMBS</h1>
        <div class="subtitle">지하 카타콤의 심장부, 실시간 탐험 점수 정산소</div>
    </header>

    <!-- 탐험가 세팅 섹션 -->
    <section class="card" id="setup-section">
        <h2>탐험가 구성 설정</h2>
        <div class="player-form-grid" style="margin-bottom: 15px;">
            <div class="input-group">
                <label>참여 탐험가 수</label>
                <input type="number" id="player-count" min="1" max="6" value="2">
            </div>
        </div>
        <div id="player-name-inputs" class="player-form-grid" style="margin-bottom: 15px;"></div>
        <button id="btn-init-players">탐험대 구성 완료 및 시작</button>
    </section>

    <!-- 점수 기록 섹션 -->
    <section class="card" id="scoring-section" style="display:none;">
        <h2>탐험가별 실시간 기록 관리</h2>
        <div id="players-scoring-container" class="players-grid"></div>
        <button id="btn-record-all" style="width: 100%; margin-top: 10px; padding: 12px; font-size: 1.1rem;">전체 점수 실시간 반영 및 순위 갱신</button>
    </section>

    <!-- 실시간 순위표 및 피드 섹션 -->
    <section class="card" id="dashboard-section" style="display:none;">
        <h2>실시간 던전 탐험 순위</h2>
        <table class="leaderboard-table">
            <thead>
                <tr>
                    <th>순위</th>
                    <th>탐험가 이름</th>
                    <th>생존 상태</th>
                    <th>유물 점수</th>
                    <th>총점</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body"></tbody>
        </table>

        <h2 style="margin-top: 30px;">실시간 점수 변동 피드</h2>
        <div class="log-container" id="score-log-feed">
            <div class="log-item">[시스템] 카타콤 던전 탐험이 시작되었습니다. 점수를 입력하고 반영해 주세요.</div>
        </div>
    </section>
</div>

<script>
    let sessionData = {
        players: []
    };

    const setupSection = document.getElementById('setup-section');
    const scoringSection = document.getElementById('scoring-section');
    const dashboardSection = document.getElementById('dashboard-section');
    
    const playerCountInput = document.getElementById('player-count');
    const playerNameInputs = document.getElementById('player-name-inputs');
    const btnInitPlayers = document.getElementById('btn-init-players');
    
    const playersScoringContainer = document.getElementById('players-scoring-container');
    const btnRecordAll = document.getElementById('btn-record-all');
    
    const leaderboardBody = document.getElementById('leaderboard-body');
    const scoreLogFeed = document.getElementById('score-log-feed');

    function renderPlayerNameInputs() {
        const count = parseInt(playerCountInput.value) || 2;
        playerNameInputs.innerHTML = '';
        for (let i = 0; i < count; i++) {
            playerNameInputs.innerHTML += `
                <div class="input-group">
                    <label>탐험가 ${i + 1} 이름</label>
                    <input type="text" class="p-name-input" value="모험가 ${i + 1}">
                </div>
            `;
        }
    }

    playerCountInput.addEventListener('input', renderPlayerNameInputs);
    renderPlayerNameInputs();

    btnInitPlayers.addEventListener('click', () => {
        const nameInputs = document.querySelectorAll('.p-name-input');
        sessionData.players = [];
        
        nameInputs.forEach((input, index) => {
            sessionData.players.push({
                id: index,
                name: input.value.trim() || `모험가 ${index + 1}`,
                isAlive: true,
                mission: false,
                artifact: 0,
                gold: 0,
                token: 0,
                card: 0,
                totalScore: 0
            });
        });

        renderScoringCards();
        updateLeaderboard();
        
        setupSection.style.display = 'none';
        scoringSection.style.display = 'block';
        dashboardSection.style.display = 'block';
    });

    function renderScoringCards() {
        playersScoringContainer.innerHTML = '';
        sessionData.players.forEach(p => {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'player-card';
            cardDiv.innerHTML = `
                <!-- 사망 시 표시될 오버레이 창 -->
                <div class="death-overlay ${p.isAlive ? 'hidden' : ''}" data-overlay-id="${p.id}">
                    <div class="death-title">사망</div>
                    <button class="btn-close-death" data-id="${p.id}">✕ 닫기</button>
                </div>

                <div class="player-card-header">
                    <span>${p.name}</span>
                </div>
                <label class="checkbox-group">
                    <input type="checkbox" class="input-is-alive" data-id="${p.id}" ${p.isAlive ? 'checked' : ''}>
                    <span>생존 탈출 여부</span>
                </label>
                <label class="checkbox-group">
                    <input type="checkbox" class="input-mission" data-id="${p.id}" ${p.mission ? 'checked' : ''} ${!p.isAlive ? 'disabled' : ''}>
                    <span>임무 완수 토큰 (+20점)</span>
                </label>
                <div class="score-inputs-grid">
                    <div class="input-group">
                        <label>유물 점수</label>
                        <input type="number" class="input-artifact" data-id="${p.id}" value="${p.artifact}" min="0" ${!p.isAlive ? 'disabled' : ''}>
                    </div>
                    <div class="input-group">
                        <label>금화 (+1점)</label>
                        <input type="number" class="input-gold" data-id="${p.id}" value="${p.gold}" min="0" ${!p.isAlive ? 'disabled' : ''}>
                    </div>
                    <div class="input-group">
                        <label>토큰 점수</label>
                        <input type="number" class="input-token" data-id="${p.id}" value="${p.token}" min="0" ${!p.isAlive ? 'disabled' : ''}>
                    </div>
                    <div class="input-group">
                        <label>카드 점수</label>
                        <input type="number" class="input-card" data-id="${p.id}" value="${p.card}" min="0" ${!p.isAlive ? 'disabled' : ''}>
                    </div>
                </div>
            `;
            playersScoringContainer.appendChild(cardDiv);
        });

        // 생존 체크박스 이벤트 핸들러
        document.querySelectorAll('.input-is-alive').forEach(chk => {
            chk.addEventListener('change', (e) => {
                const id = parseInt(e.target.dataset.id);
                const card = e.target.closest('.player-card');
                const overlay = card.querySelector('.death-overlay');
                const inputs = card.querySelectorAll('input:not(.input-is-alive)');
                
                if (!e.target.checked) {
                    overlay.classList.remove('hidden');
                    inputs.forEach(input => {
                        input.disabled = true;
                        if (input.type === 'checkbox') input.checked = false;
                        else input.value = 0;
                    });
                } else {
                    overlay.classList.add('hidden');
                    inputs.forEach(input => input.disabled = false);
                }
            });
        });

        // 사망 오버레이 닫기(X) 버튼 이벤트 핸들러
        document.querySelectorAll('.btn-close-death').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = parseInt(e.target.dataset.id);
                const card = e.target.closest('.player-card');
                const overlay = card.querySelector('.death-overlay');
                overlay.classList.add('hidden');
            });
        });
    }

    btnRecordAll.addEventListener('click', () => {
        sessionData.players.forEach(p => {
            const card = playersScoringContainer.querySelector(`[data-id="${p.id}"].input-is-alive`).closest('.player-card');
            
            const isAlive = card.querySelector('.input-is-alive').checked;
            p.isAlive = isAlive;

            if (!isAlive) {
                p.mission = false;
                p.artifact = 0;
                p.gold = 0;
                p.token = 0;
                p.card = 0;
                p.totalScore = 0;
            } else {
                p.mission = card.querySelector('.input-mission').checked;
                p.artifact = parseInt(card.querySelector('.input-artifact').value) || 0;
                p.gold = parseInt(card.querySelector('.input-gold').value) || 0;
                p.token = parseInt(card.querySelector('.input-token').value) || 0;
                p.card = parseInt(card.querySelector('.input-card').value) || 0;

                const missionScore = p.mission ? 20 : 0;
                p.totalScore = missionScore + p.artifact + p.gold + p.token + p.card;
            }
        });

        updateLeaderboard();
        addLog(`[점수 갱신] 모든 탐험가의 최신 점수가 반영되었습니다.`);
    });

    function updateLeaderboard() {
        const sortedPlayers = [...sessionData.players].sort((a, b) => {
            if (b.totalScore !== a.totalScore) {
                return b.totalScore - a.totalScore;
            }
            return b.artifact - a.artifact;
        });

        leaderboardBody.innerHTML = '';
        sortedPlayers.forEach((p, index) => {
            const tr = document.createElement('tr');
            if (index === 0) tr.classList.add('rank-1');

            const rankText = `${index + 1}위`;
            const aliveBadge = p.isAlive 
                ? `<span class="alive-badge">생존 탈출</span>` 
                : `<span class="dead-badge">사망 (0점)</span>`;

            tr.innerHTML = `
                <td>${rankText}</td>
                <td>${p.name}</td>
                <td>${aliveBadge}</td>
                <td>${p.artifact}점</td>
                <td><strong>${p.totalScore}점</strong></td>
            `;
            leaderboardBody.appendChild(tr);
        });
    }

    function addLog(message) {
        const div = document.createElement('div');
        div.className = 'log-item';
        div.textContent = `${new Date().toLocaleTimeString()} - ${message}`;
        scoreLogFeed.prepend(div);
    }
</script>

</body>
</html>
