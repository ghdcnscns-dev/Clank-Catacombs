<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>클랭크 카타콤: 자동점수계산기</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nanum+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0c0908;
            --panel-bg: #1a1512;
            --panel-border: #3d2e24;
            --accent-gold: #d4af37;
            --accent-gold-hover: #f1c40f;
            --text-main: #e0d5c1;
            --text-muted: #9c8b77;
            --danger: #c0392b;
            --success: #27ae60;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Nanum Gothic', sans-serif; background-image: radial-gradient(circle at center, #231914 0%, #0c0908 100%); min-height: 100vh; padding: 10px; }

        .container { max-width: 100%; margin: 0 auto; }
        header { text-align: center; margin-bottom: 15px; border-bottom: 2px solid var(--accent-gold); padding-bottom: 10px; }
        h1 { font-family: 'Cinzel', serif; color: var(--accent-gold); font-size: 1.5rem; letter-spacing: 1px; text-shadow: 0 2px 4px rgba(0,0,0,0.7); margin-bottom: 5px; }
        
        .card { background-color: var(--panel-bg); border: 2px solid var(--panel-border); border-radius: 8px; padding: 12px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.6); }
        
        input[type="text"], button { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid var(--panel-border); background: #0f0b09; color: var(--text-main); }
        button { background: linear-gradient(to bottom, #d4af37, #997a15); color: #0c0908; font-weight: bold; cursor: pointer; }
        
        #room-section { text-align: center; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>CLANK! CATACOMBS</h1>
        <div class="subtitle">방 생성 및 점수 계산</div>
    </header>

    <!-- 방 생성/입장 섹션 -->
    <section class="card" id="room-section">
        <h2>던전 입장</h2>
        <input type="text" id="room-name" placeholder="방 이름을 입력하세요">
        <button id="btn-create-room">새로운 던전 생성</button>
        <div id="room-info" style="margin-top:10px; color: var(--accent-gold);"></div>
    </section>
</div>

<script>
    const SUPABASE_URL = "https://dsmglkqlmqxqcamhkfww.supabase.co/rest/v1/";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRzbWdsa3FsbXF4cWNhbWhrZnd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MTU4MzEsImV4cCI6MjEwMjA5MTgzMX0.hGZx467Oa4e9p39JMvkNPYfPuAmjQN--7GyNqYiv66o";

    document.getElementById('btn-create-room').addEventListener('click', async () => {
        const roomName = document.getElementById('room-name').value.trim();
        if (!roomName) return alert("방 이름을 입력해주세요.");

        try {
            const response = await fetch(`${SUPABASE_URL}rooms`, {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=representation'
                },
                body: JSON.stringify({ name: roomName })
            });

            if (response.ok) {
                const data = await response.json();
                document.getElementById('room-info').textContent = `던전 '${roomName}' 생성 완료! (ID: ${data[0].id})`;
            } else {
                alert("방 생성 실패");
            }
        } catch (e) {
            console.error(e);
            alert("서버 연결 오류");
        }
    });
</script>

</body>
</html>
